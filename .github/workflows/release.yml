name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Builds and tests the exe without publishing; the exe is uploaded as a run artifact.
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # npm ci runs audify's install script, which fetches its Windows prebuild
      # (audify.node + rtaudio.dll + opus.dll). bun install would skip it.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Install cloud-server dependencies
        run: npm ci
        working-directory: cloud-server

      - name: Type check
        run: npx tsc --build

      - name: Extract version
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "tag ${{ github.ref_name }} does not match package.json version $version"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh

      - name: Compile executable
        run: bun scripts/compile.ts bun-windows-x64 dist/live-captions.exe

      # Windows version info + manifest (winres/winres.json). An unsigned exe that
      # does not identify itself is what Defender's ML detection flags.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Stamp version info and manifest
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          $v = "${{ steps.version.outputs.value }}"
          & "$(go env GOPATH)\bin\go-winres.exe" patch --no-backup --product-version $v --file-version $v dist/live-captions.exe
          if ($LASTEXITCODE -ne 0) { throw "go-winres patch failed" }

      # Starts the stamped exe and checks that audify's addon loaded (its DLLs come
      # out of the exe), the embedded frontend is served, and the version info is set.
      - name: Smoke test
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $info = (Get-Item dist/live-captions.exe).VersionInfo
          if ($info.FileVersion -notlike "$v*") { throw "FileVersion is '$($info.FileVersion)', expected $v" }
          $work = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\lc-run"
          $p = Start-Process -FilePath (Resolve-Path dist/live-captions.exe) -ArgumentList '--skip-update-check' `
            -WorkingDirectory $work -PassThru -RedirectStandardOutput "$work\out.log" -RedirectStandardError "$work\err.log"
          try {
            $up = $false
            for ($i = 0; $i -lt 60 -and -not $up; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { break }
              try { Invoke-WebRequest http://127.0.0.1:3000/ -UseBasicParsing | Out-Null; $up = $true } catch { }
            }
            if (-not $up) { throw "server did not start" }
            $index = Invoke-WebRequest http://127.0.0.1:3000/ -UseBasicParsing
            Invoke-WebRequest http://127.0.0.1:3000/settings.html -UseBasicParsing | Out-Null
            $asset = [regex]::Match($index.Content, 'assets/[^"]+\.js').Value
            if (-not $asset) { throw "no script in index.html" }
            Invoke-WebRequest "http://127.0.0.1:3000/$asset" -UseBasicParsing | Out-Null
            $devices = Invoke-WebRequest http://127.0.0.1:3000/trpc/devices.list -UseBasicParsing
            if ($devices.Content -notmatch '"result"') { throw "devices.list failed: $($devices.Content)" }
            $native = "$env:APPDATA\live-captions\native\$v"
            foreach ($f in 'audify.node', 'rtaudio.dll', 'opus.dll') {
              if (-not (Test-Path "$native\$f")) { throw "$native\$f missing" }
            }
            Write-Host "smoke test passed: $($devices.Content)"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Get-Content "$work\out.log", "$work\err.log" -ErrorAction SilentlyContinue | Select-Object -First 60
          }

      - name: Rename executable
        run: |
          mv dist/live-captions.exe "dist/live-captions-${{ steps.version.outputs.value }}.exe"
        shell: pwsh

      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: live-captions-${{ steps.version.outputs.value }}
          path: dist/live-captions-${{ steps.version.outputs.value }}.exe

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/live-captions-${{ steps.version.outputs.value }}.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
